[package]
name = "regex-entity-scanner"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
description = "Two-stage regex entity scanner: prefilter, validate, normalise, resolve"
publish = false

[lib]
name = "regex_entity_scanner"
path = "src/lib.rs"

[[bin]]
name = "regex-entity-scanner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
jiff = "0.2"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
